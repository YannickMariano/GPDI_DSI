spring.application.name=gpdi
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect

# Piece jointe d'un commentaire de tache (voir CommentaireServiceImpl.TAILLE_MAX_OCTETS, meme valeur).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
dsi.gpdi.security.keycloak-client-id=${KEYCLOAK_CLIENT_ID}

# Client technique dedie (Client Credentials) pour le provisioning automatique des comptes
# Keycloak depuis la creation/suppression d'un utilisateur GPDI. Optionnel : si absent, la
# creation cote GPDI reste possible, le compte Keycloak devra alors etre cree manuellement.
dsi.gpdi.keycloak.admin-base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
dsi.gpdi.keycloak.realm=${KEYCLOAK_REALM:gpdi}
dsi.gpdi.keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:}
dsi.gpdi.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

dsi.gpdi.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Module IA : Ollama execute en local (aucune donnee ne quitte la machine). Le timeout doit couvrir le
# chargement a froid du modele (mesure : ~160 s apres une inactivite > keep-alive, ~9 s modele charge).
# keep-alive : duree pendant laquelle Ollama garde le modele en memoire apres un appel (defaut Ollama : 5 min).
dsi.gpdi.ia.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
dsi.gpdi.ia.ollama.model=${OLLAMA_MODEL:qwen3:8b}
dsi.gpdi.ia.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:300}
dsi.gpdi.ia.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:30m}
dsi.gpdi.ia.ollama.num-ctx=${OLLAMA_NUM_CTX:8192}

# Detection automatique des risques des projets en cours (cron Spring a 6 champs : chaque nuit a 2 h).
# La valeur "-" desactive la tache planifiee.
dsi.gpdi.ia.risque.cron=${IA_RISQUE_CRON:0 0 2 * * *}

# Desactive le redemarrage automatique de spring-boot-devtools : l'extension Java de l'IDE recompile
# aussi dans target/classes en tache de fond, ce qui declenchait des redemarrages intempestifs avec
# un classpath incoherent (ex. authentification qui echoue jusqu'a un redemarrage manuel complet).
spring.devtools.restart.enabled=false
