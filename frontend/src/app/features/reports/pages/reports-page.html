<div class="reports">
  <aside class="reports__catalogue">
    <h2>Projet du rapport</h2>
    <select class="reports__project-select" aria-label="Projet du rapport" [value]="projetId()" (change)="selectProjet($any($event.target).value)">
      @for (p of projetsDisponibles(); track p.id) {
        <option [value]="p.id" [selected]="p.id === projetId()">{{ p.nom }}</option>
      }
    </select>

    <h2>Modèles de rapport</h2>
    <ul class="reports__list">
      @for (t of templates(); track t.id) {
        <li>
          <button type="button" class="reports__template" [class.reports__template--active]="t.id === selectedId()" (click)="selectTemplate(t.id)">
            <span class="reports__template-head">
              <span class="reports__template-icon" [style.color]="t.couleur" aria-hidden="true">{{ t.icone }}</span>
              <span class="reports__template-name">{{ t.nom }}</span>
            </span>
            <span class="reports__template-desc">{{ t.description }}</span>
          </button>
        </li>
      }
    </ul>
  </aside>

  <section class="reports__preview">
    @if (document(); as doc) {
      <div class="reports__toolbar">
        <div>
          <span class="reports__report-name">{{ doc.nom }}</span>
          <span class="reports__report-meta">{{ doc.meta }}</span>
        </div>
        <div class="reports__toolbar-actions">
          <button type="button" [disabled]="exportEnCours()" (click)="exporterPdf()">{{ exportEnCours() ? 'Export PDF…' : 'Exporter PDF' }}</button>
          <button type="button" class="reports__primary" [disabled]="diffusionEnCours() || !projetId()" (click)="diffuser()">
            {{ diffusionEnCours() ? 'Diffusion…' : 'Diffuser' }}
          </button>
        </div>
      </div>

      <app-report-document [doc]="doc" />
    }
  </section>
</div>
